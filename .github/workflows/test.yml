name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Run unit tests
        run: node --test tests/collect-session-contexts.test.mjs

      - name: Test installer and uninstaller
        run: |
          export CODEX_HOME="$(mktemp -d)/.codex"
          ./setup.sh
          test -f "$CODEX_HOME/skills/codex-session-renamer/SKILL.md"
          ./uninstall.sh
          test ! -e "$CODEX_HOME/skills/codex-session-renamer"
